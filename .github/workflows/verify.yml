name: Gas Fee Optimizer — tests, Worker and Pharos RPC verification
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test deadlines, secure signed tx, retries and gas receipt math
        run: npm test
      - name: Wrangler Worker build dry-run
        run: npm run build
  live-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify live Pharos gas and actual historical mined gas, safely probe invalid broadcast
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pharos-gas-optimizer-live-rpc-evidence
          path: proof/live-rpc-proof.json
          retention-days: 30
          if-no-files-found: warn
